services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-thebreaksite}
      MARIADB_USER: ${DB_USER:-tbs}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-thebreaksite}
      DB_USER: ${DB_USER:-tbs}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BLOBS_DIR: /app/public/images/uploads
    volumes:
      - tbs_data:/app/data
      - tbs_uploads:/app/public/images/uploads
      - tbs_content:/app/content/posts
      - tbs_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tbs_uploads:/uploads:ro
    depends_on:
      - web

volumes:
  mariadb_data:
  tbs_data:
  tbs_uploads:
  tbs_content:
  tbs_backups:
