services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-thebreaksite}
      MARIADB_USER: ${DB_USER:-tbs}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://thebreaksurf.co.uk}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_live_placeholder}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-thebreaksite}
      DB_USER: ${DB_USER:-tbs}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BLOBS_DIR: /app/public/images/uploads
    volumes:
      - tbs_data:/app/data
      - tbs_uploads:/app/public/images/uploads
      - tbs_content:/app/content/posts
      - tbs_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  # Admin panel: same image, separate runtime. Shares the database and
  # volumes with web; nginx routes admin.thebreaksurf.co.uk here.
  admin:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://thebreaksurf.co.uk}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_live_placeholder}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-thebreaksite}
      DB_USER: ${DB_USER:-tbs}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BLOBS_DIR: /app/public/images/uploads
    volumes:
      - tbs_data:/app/data
      - tbs_uploads:/app/public/images/uploads
      - tbs_content:/app/content/posts
      - tbs_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  # Password-vault file engine (full WebDAV incl. PROPFIND — nginx's own
  # dav module can't do PROPFIND on this build). Internal only; edge
  # nginx holds the basic-auth gate + fail2ban logging.
  vault:
    image: sigoden/dufs:latest
    restart: unless-stopped
    command: /data -p 5000 --allow-all
    expose:
      - "5000"
    networks:
      - default
      - tbs_edge
    volumes:
      - /srv/webdav:/data:rw

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      # 80 = Cloudflare origin traffic, 3000 = direct staging access
      - "80:80"
      - "3000:80"
    networks:
      - default
      - tbs_edge
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tbs_uploads:/uploads:ro
      # Password vault (host paths, not Docker volumes — survives compose changes)
      - /srv/keeweb:/srv/keeweb:ro
      - /srv/webdav:/srv/webdav:rw
      - /srv/acme:/var/www/acme
      - /srv/nginx-logs:/var/log/nginx
    depends_on:
      - web

volumes:
  mariadb_data:
  tbs_data:
  tbs_uploads:
  tbs_content:
  tbs_backups:

networks:
  tbs_edge:
    external: true
