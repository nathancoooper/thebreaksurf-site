services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    volumes:
      - tbs_data:/app/data
      - tbs_uploads:/app/public/images/uploads
      - tbs_content:/app/content/posts
      - tbs_backups:/app/backups

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - tbs_uploads:/uploads:ro
    depends_on:
      - web

volumes:
  tbs_data:
  tbs_uploads:
  tbs_content:
  tbs_backups:
