# Password vault — dav.nathanjohncooper.co.uk. KeeWeb UI at /, KeePass
# database over WebDAV at /Passwords.kdbx (same origin, no CORS headaches).
# Whole host behind basic auth (second gate) + fail2ban on 401s.
# NOTE (Sep 2026): without the real_ip block below, nginx logs/fail2ban see
# Cloudflare edge IPs instead of clients — we once banned an edge IP and
# blocked legit traffic. Never remove this.
server {
    listen 80;
    server_name dav.nathanjohncooper.co.uk;
    client_max_body_size 50M;

    # Restore real client IPs from Cloudflare (see AGENTS.md: edge-IP ban incident)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    auth_basic "vault";
    auth_basic_user_file /srv/webdav/.htpasswd;

    access_log /var/log/nginx/vault-access.log;

    # KeeWeb static UI. Anything the static handler rejects with 405
    # (i.e. all DAV methods: PUT temp files, MOVE, PROPFIND, LOCK…)
    # falls through to dufs. This is what makes KeeWeb's atomic
    # save-via-temp-file+MOVE strategy work.
    location / {
        root /srv/keeweb;
        index index.html;
        try_files $uri $uri/ /index.html;
        error_page 405 = @dav;
    }

    location @dav {
        proxy_pass http://vault:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Depth $http_depth;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite $http_overwrite;
        add_header Cache-Control "private, no-store" always;
    }

    # KeePass database over WebDAV, served by the vault (dufs) container.
    # NOTE: nginx's own dav module was tried first and CANNOT do
    # PROPFIND/OPTIONS on this build (405s everything, even minimal
    # textbook config) — dufs answers full 207 Multi-Status.
    location = /Passwords.kdbx {
        proxy_pass http://vault:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Depth $http_depth;
        add_header Cache-Control "private, no-store" always;
    }

    # ACME challenge for certbot. NOTE: certbot --webroot writes to
    # <webroot>/.well-known/acme-challenge/, so this must be a `root`
    # (not alias) mapping with webroot=/srv/acme-root. An alias here
    # 404s every validation (learned the hard way, Sep 2026).
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/acme-root;
    }
}

# Vault over real TLS (certbot). This zone should be Full (Strict) in
# Cloudflare — unlike the Flexible zones used for the other sites.
server {
    listen 443 ssl;
    server_name dav.nathanjohncooper.co.uk;

    ssl_certificate /etc/letsencrypt/live/dav.nathanjohncooper.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dav.nathanjohncooper.co.uk/privkey.pem;

    client_max_body_size 50M;

    auth_basic "vault";
    auth_basic_user_file /srv/webdav/.htpasswd;

    access_log /var/log/nginx/vault-access.log;

    location / {
        root /srv/keeweb;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /Passwords.kdbx {
        proxy_pass http://vault:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Depth $http_depth;
        add_header Cache-Control "private, no-store" always;
    }
}

# Fallback (direct-IP staging access, health checks).
server {
    listen 80 default_server;
    client_max_body_size 5G;

    location /images/uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
