# Public site — thebreaksurf.co.uk (+ staging via direct IP).
server {
    listen 80;
    server_name thebreaksurf.co.uk www.thebreaksurf.co.uk;
    client_max_body_size 5G;

    # Serve uploaded files directly from the volume — bypass Node.js entirely
    location /images/uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else goes to Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# Admin panel — admin.thebreaksurf.co.uk. Same image as web, separate
# container so admin workloads never share the storefront's runtime.
server {
    listen 80;
    server_name admin.thebreaksurf.co.uk;
    client_max_body_size 5G;

    # No public homepage here — straight into the panel (the app's own
    # session gate bounces unauthenticated visitors to /admin/login).
    # Absolute https:// because Cloudflare terminates TLS (Flexible mode).
    location = / {
        return 302 https://$host/admin;
    }

    location /images/uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No caching on admin — every response is authenticated and live.
    location / {
        proxy_pass http://admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "private, no-store" always;
    }
}

# Finance + till — served by the companies-finance compose project on the
# shared tbs_edge network. Same pattern as admin: separate runtime.
# NOTE: upstream via variable + Docker resolver so nginx starts (and stays
# up) regardless of container start order — static hostnames crash nginx
# with emerg if the target doesn't exist at boot (Sep 2026 outage).
server {
    listen 80;
    server_name finance.nathanjohncooper.co.uk;
    client_max_body_size 5G;
    resolver 127.0.0.11 valid=10s;
    set $finance_upstream http://companies-finance-finance-1:3000;

    location /images/uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass $finance_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "private, no-store" always;
    }
}

server {
    listen 80;
