# Public site — thebreaksurf.co.uk (+ staging via direct IP).
server {
    listen 80;
    server_name thebreaksurf.co.uk www.thebreaksurf.co.uk;
    client_max_body_size 5G;

    # Serve uploaded files directly from the volume — bypass Node.js entirely
    location /images/uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else goes to Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# Admin panel — admin.thebreaksurf.co.uk. Same image as web, separate
# container so admin workloads never share the storefront's runtime.
server {
    listen 80;
    server_name admin.thebreaksurf.co.uk;
    client_max_body_size 5G;

    location /images/uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No caching on admin — every response is authenticated and live.
    location / {
        proxy_pass http://admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "private, no-store" always;
    }
}

# Fallback (direct-IP staging access, health checks).
server {
    listen 80 default_server;
    client_max_body_size 5G;

    location /images/uploads/ {
        alias /uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}
