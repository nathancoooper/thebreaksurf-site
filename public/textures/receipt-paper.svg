<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="paper" patternUnits="userSpaceOnUse" width="200" height="200">
      <rect width="200" height="200" fill="#f5f5f0"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="#e8e8e0" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="4" x2="200" y2="4" stroke="#e8e8e0" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#paper)"/>
</svg>
